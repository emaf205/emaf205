name: Update Profile Showcase

on:
  schedule:
    - cron: '0 3 * * 1' # Run every Monday at 03:00 UTC
  workflow_dispatch:     # Allow manual trigger with 1-click in GitHub Actions tab
  push:
    paths:
      - 'scripts/generate_profile.py'
      - 'assets/covers/**'

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Generate Profile README
        run: |
          python scripts/generate_profile.py

      - name: Commit and push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md
          if git diff --staged --quiet; then
            echo "No changes in README.md to commit."
          else
            git commit -m "chore(profile): auto-update visual showcase timeline [skip ci]"
            git push
          fi
